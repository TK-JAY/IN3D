let quoteText='';function calculate(){let n=id=>Math.max(0,num(id));if(current[0]==='misc'){let g=n('volume')*n('density');$('result').innerHTML=`<div class="metrics"><div class="metric">Khối lượng<b>${g.toFixed(1)} g</b></div><div class="metric">Chi phí nhựa<b>${money(g*n('price')/1000)}</b></div></div>`;return}let mat=n('grams')*n('price')/1000,elec=n('hours')*n('watts')/1000*n('electric'),mach=n('hours')*n('machine'),risk=(mat+elec+mach)*n('waste')/100,cost=mat+elec+mach+risk+n('labor')+n('pack'),d=1-(n('fee')+n('margin'))/100;if(d<=0){$('result').textContent='Tổng phí sàn và biên lợi nhuận phải dưới 100%.';quoteText='';return}let sale=Math.ceil(cost/d/1000)*1000,profit=sale*(1-n('fee')/100)-cost;let a=[['Vật liệu',mat],['Điện',elec],['Khấu hao máy',mach],['Hao hụt',risk],['Công',n('labor')],['Đóng gói',n('pack')]];$('result').innerHTML=`<div class="metrics"><div class="metric">Tổng giá vốn<b>${money(cost)}</b></div><div class="metric">Giá bán gợi ý<b>${money(sale)}</b></div><div class="metric">Lợi nhuận ước tính<b>${money(profit)}</b></div></div><hr style="border:0;border-top:1px solid #293a50">${a.map(([k,v])=>`<p style="display:flex;justify-content:space-between">${k}<strong>${money(v)}</strong></p>`).join('')}`;quoteText=`JayIT IN 3D – Báo giá\nGiá vốn: ${money(cost)}\nGiá bán: ${money(sale)}\nLợi nhuận ước tính: ${money(profit)}`}async function copyQuote(){if(!quoteText)return;try{await navigator.clipboard.writeText(quoteText)}catch{let a=document.createElement('textarea');a.value=quoteText;document.body.append(a);a.select();document.execCommand('copy');a.remove()}}
